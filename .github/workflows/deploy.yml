name: UiPath Daily Market Brief CI/CD

on:
  push:
    branches: [deploy]

jobs:
  build:
    name: Pack the project into a NuGet package
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "Runner user: $env:USERNAME"
          echo "Org: ${{ secrets.UIPATH_ORG }}"
          echo "Tenant: ${{ secrets.UIPATH_TENANT }}"
          echo "Client ID: ${{ secrets.UIPATH_CLIENT_ID }}"
          dotnet --version
          uipcli --version

      - name: Install UiPath CLI
        run: |
          dotnet tool install --global UiPath.CLI.Windows --version 25.10.20 2>$null
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global UiPath.CLI.Windows --version 25.10.20
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Pack UiPath Project
        run: |
          uipcli package pack "${{ github.workspace }}\project.json" `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketBrief-Package
          path: ${{ github.workspace }}\output

  deploy:
    name: Deploy the package to Orchestrator
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MarketBrief-Package
          path: ${{ github.workspace }}\output

      - name: Debug environment
        run: |
          echo "Runner user: $env:USERNAME"
          echo "Org: ${{ secrets.UIPATH_ORG }}"
          echo "Tenant: ${{ secrets.UIPATH_TENANT }}"
          echo "Client ID: ${{ secrets.UIPATH_CLIENT_ID }}"
          dotnet --version
          uipcli --version

      - name: List output folder
        run: Get-ChildItem -Recurse "${{ github.workspace }}\output"

      - name: Install UiPath CLI
        run: |
          dotnet tool install --global UiPath.CLI.Windows --version 25.10.20 2>$null
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global UiPath.CLI.Windows --version 25.10.20
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Deploy to Orchestrator
        run: |
          $packageFile = Get-ChildItem -Path "${{ github.workspace }}\output" -Filter '*.nupkg' -Recurse | Select-Object -First 1
          if (-not $packageFile) {
            Write-Error "No .nupkg found in output folder"
            exit 1
          }
          Write-Host "Using package: $($packageFile.FullName)"

          if ([string]::IsNullOrWhiteSpace("${{ secrets.UIPATH_ORG }}") -or
              [string]::IsNullOrWhiteSpace("${{ secrets.UIPATH_TENANT }}") -or
              [string]::IsNullOrWhiteSpace("${{ secrets.UIPATH_CLIENT_ID }}") -or
              [string]::IsNullOrWhiteSpace("${{ secrets.UIPATH_CLIENT_SECRET }}")) {
            Write-Error "One or more UiPath secrets are missing"
            exit 1
          }

          uipcli package deploy $packageFile.FullName `
            "https://cloud.uipath.com/" `
            "${{ secrets.UIPATH_TENANT }}" `
            -A "${{ secrets.UIPATH_ORG }}" `
            -I "${{ secrets.UIPATH_CLIENT_ID }}" `
            -S "${{ secrets.UIPATH_CLIENT_SECRET }}" `
            --applicationScope "${{ secrets.UIPATH_APP_SCOPE }}" `
            -o "UiPathTraining/Portfolio Projects" `
            --traceLevel Verbose

      - name: Cleanup
        if: always()
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}\output" -ErrorAction SilentlyContinue