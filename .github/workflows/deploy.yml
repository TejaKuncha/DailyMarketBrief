name: UiPath Daily Market Brief CI/CD

on:
  push:
    branches: [deploy]

jobs:
  build:
    name: Pack the project into a NuGet package
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install UiPath CLI
        run: |
          dotnet tool install --global UiPath.CLI.Windows --version 25.10.20 2>$null
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global UiPath.CLI.Windows --version 25.10.20
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Pack UiPath Project
        run: |
          uipcli package pack "${{ github.workspace }}\project.json" `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketBrief-Package
          path: ${{ github.workspace }}\output

  deploy:
    name: Deploy the package to Orchestrator
    needs: build
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MarketBrief-Package
          path: ${{ github.workspace }}\output

      - name: Install UiPath CLI
        run: |
          dotnet tool install --global UiPath.CLI.Windows --version 25.10.20 2>$null
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update --global UiPath.CLI.Windows --version 25.10.20
          }
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Deploy to Orchestrator
        env:
          UIPATH_ORG: ${{ secrets.UIPATH_ORG }}
          UIPATH_TENANT: ${{ secrets.UIPATH_TENANT }}
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
          UIPATH_APP_SCOPE: ${{ secrets.UIPATH_APP_SCOPE }}
        run: |
          $packageFile = Get-ChildItem -Path "${{ github.workspace }}\output" -Filter '*.nupkg' -Recurse | Select-Object -First 1
          if (-not $packageFile) {
            Write-Error "No .nupkg found in output folder"
            exit 1
          }
          Write-Host "Using package: $($packageFile.FullName)"

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UIPATH_ORG)) { $missing += 'UIPATH_ORG' }
          if ([string]::IsNullOrWhiteSpace($env:UIPATH_TENANT)) { $missing += 'UIPATH_TENANT' }
          if ([string]::IsNullOrWhiteSpace($env:UIPATH_CLIENT_ID)) { $missing += 'UIPATH_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:UIPATH_CLIENT_SECRET)) { $missing += 'UIPATH_CLIENT_SECRET' }

          if ($missing.Count -gt 0) {
            Write-Error ("Missing UiPath secrets: " + ($missing -join ', '))
            exit 1
          }

          uipcli package deploy "$($packageFile.FullName)" `
            "https://cloud.uipath.com/" `
            $env:UIPATH_TENANT `
            -A $env:UIPATH_ORG `
            -I $env:UIPATH_CLIENT_ID `
            -S $env:UIPATH_CLIENT_SECRET `
            --applicationScope $env:UIPATH_APP_SCOPE `
            -o "UiPathTraining/Portfolio Projects" `
            --traceLevel Verbose

      - name: Cleanup
        if: always()
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}\output" -ErrorAction SilentlyContinue